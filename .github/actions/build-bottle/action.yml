name: Build Homebrew bottle
description: >
  Build a xapiand Homebrew bottle from the checked-out source, attach the
  .bottle.tar.gz to the release, and upload the per-cell bottle JSON as an
  artifact for the tap-merge step. Expects the repo to already be checked out.

inputs:
  tag:
    description: "Release tag the bottle is built for (used in the bottle root URL)."
    required: true
  repository:
    description: "owner/repo the release lives in (github.repository)."
    required: true
  os:
    description: "Runner OS label; names the uploaded JSON artifact (bottle-json-<os>)."
    required: true
  brew:
    description: >
      The brew command to build with. Defaults to the host brew; pass
      "arch -x86_64 /usr/local/bin/brew" to build an x86_64 bottle under Rosetta 2
      on an arm64 runner.
    required: false
    default: brew

runs:
  using: composite
  steps:
    - name: Build bottle
      shell: bash
      run: |
        set -eux
        # BREW is the host brew by default, or an emulated x86_64 brew (via Rosetta)
        # when building the Intel bottle on an arm64 runner. Unquoted on use so
        # "arch -x86_64 /usr/local/bin/brew" word-splits into the command + args.
        BREW="${{ inputs.brew }}"
        # Build under the real tap name (kronuz/tap) so the bottle JSON records
        # `kronuz/tap/xapiand` -- the same name the publish job resolves when it
        # merges the DSL into the checked-out tap. A throwaway name here (e.g.
        # kronuz/local) would make `brew bottle --merge` fail with "No available
        # formula". The formula content still comes from contrib/ (source of truth).
        TAP=kronuz/tap
        $BREW tap-new "$TAP" --no-git
        cp contrib/homebrew/xapiand.rb "$($BREW --repository "$TAP")/Formula/xapiand.rb"
        $BREW install --build-bottle "$TAP/xapiand"
        $BREW bottle --json --no-rebuild \
          --root-url="https://github.com/${{ inputs.repository }}/releases/download/${{ inputs.tag }}" \
          "$TAP/xapiand"
        # Homebrew writes the file with a '--' separator, but the download URL in
        # the bottle DSL uses a single '-'; rename so the uploaded asset matches.
        for f in *--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
        ls -la ./*.bottle.tar.gz ./*.bottle.json

    - name: Dump the full Homebrew build log on failure
      if: failure()
      shell: bash
      run: |
        # Homebrew only echoes the "Last 15 lines" to the console, which is
        # almost always just warnings and hides the real compiler error. Print
        # the complete build logs so CI shows what actually failed.
        for f in ~/Library/Logs/Homebrew/xapiand/*.log; do
          echo "::group::$f"
          cat "$f" || true
          echo "::endgroup::"
        done

    - name: Attach bottle to the release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        files: ./*.bottle.tar.gz

    - name: Upload bottle JSON (for the DSL merge)
      uses: actions/upload-artifact@v4
      with:
        name: bottle-json-${{ inputs.os }}
        path: ./*.bottle.json
