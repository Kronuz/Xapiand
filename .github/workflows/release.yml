name: Release

# Build and publish release artifacts when a version tag is pushed, or on demand
# against an existing tag (workflow_dispatch).
#   git tag v1.0.0-alpha.1 && git push origin v1.0.0-alpha.1
#
# Produces:
#   * a multi-arch Docker image (linux/amd64 + linux/arm64) on ghcr.io/kronuz/xapiand
#   * RPMs for x86_64 and aarch64 attached to the GitHub Release
#   * DEBs for amd64 and arm64 attached to the GitHub Release
#
# arm64 legs run on GitHub's native arm64 Linux runners (ubuntu-24.04-arm), so
# there is no QEMU emulation -- Apple Silicon Docker users and arm64 servers
# (AWS Graviton, Ampere) get native binaries.

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0-alpha.1)"
        required: true
        default: v1.0.0-alpha.1

permissions:
  contents: write   # create releases and upload assets
  packages: write   # push to ghcr.io

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Push each arch by digest only (no tag); the manifest job stitches them
          # into a single multi-arch tag below.
          outputs: type=image,name=ghcr.io/kronuz/xapiand,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Derive version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eux
          VER="${{ steps.version.outputs.version }}"
          docker buildx imagetools create \
            -t "ghcr.io/kronuz/xapiand:${VER}" \
            -t "ghcr.io/kronuz/xapiand:latest" \
            $(printf 'ghcr.io/kronuz/xapiand@sha256:%s ' *)

      - name: Inspect the published image
        run: docker buildx imagetools inspect "ghcr.io/kronuz/xapiand:${{ steps.version.outputs.version }}"

  rpm:
    name: Linux RPM (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build toolchain
        run: |
          set -eux
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install gcc-toolset-13 cmake ninja-build git perl tcl tar \
            pkgconf-pkg-config libzstd-devel libicu-devel libuuid-devel \
            zlib-devel libcap-devel rpm-build ruby ruby-devel make
          gem install --no-document fpm
          # Standalone Asio (header-only). EPEL's asio-devel predates the C++20
          # coroutine API (co_spawn/awaitable/any_io_executor) the reactor needs;
          # pin the same 1.28 line Ubuntu ships and the Docker image builds against.
          curl -sL https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-28-1.tar.gz \
            | tar xz -C /opt

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Derive version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and stage
        run: |
          set -eux
          source /opt/rh/gcc-toolset-13/enable
          cmake -GNinja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DASIO_INCLUDE_DIR=/opt/asio-asio-1-28-1/asio/include
          ninja -C build
          DESTDIR="$PWD/stage" ninja -C build install

      - name: Package RPM
        id: pkg
        run: |
          set -eux
          # FPM's rpm version field rejects '-'; map 1.0.0-alpha.1 -> 1.0.0 + release alpha.1
          RAW="${{ steps.version.outputs.version }}"
          VER="${RAW%%-*}"
          REL="${RAW#*-}"; [ "$REL" = "$RAW" ] && REL="1" || REL="${REL//-/.}"
          fpm -s dir -t rpm -n xapiand -v "$VER" --iteration "$REL" \
            --license MIT \
            --description "Xapiand: a RESTful search engine" \
            --url "https://github.com/Kronuz/Xapiand" \
            --depends libicu --depends libuuid --depends zlib \
            --depends libzstd --depends libcap \
            -C stage usr
          echo "rpm=$(ls xapiand-*.rpm | head -1)" >> "$GITHUB_OUTPUT"

      - name: Attach RPM to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.pkg.outputs.rpm }}

  deb:
    name: Debian/Ubuntu DEB (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Install build toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-13 cmake ninja-build pkg-config perl tcl \
            libasio-dev libzstd-dev libicu-dev uuid-dev zlib1g-dev libcap-dev \
            ruby ruby-dev
          sudo gem install --no-document fpm

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Derive version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and stage
        run: |
          set -eux
          cmake -GNinja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DASIO_INCLUDE_DIR=/usr/include
          ninja -C build
          DESTDIR="$PWD/stage" ninja -C build install

      - name: Package DEB
        id: pkg
        run: |
          set -eux
          # Debian versions use '~' for pre-releases: 1.0.0~alpha.1 sorts before 1.0.0.
          # This .deb links Ubuntu 24.04's library versions, so it targets 24.04+ / Debian 13+.
          VER="${{ steps.version.outputs.version }}"
          VER="${VER/-/\~}"
          fpm -s dir -t deb -n xapiand -v "$VER" \
            --license MIT \
            --description "Xapiand: a RESTful search engine" \
            --url "https://github.com/Kronuz/Xapiand" \
            --depends libicu74 --depends libuuid1 --depends zlib1g \
            --depends libzstd1 --depends libcap2 \
            -C stage usr
          echo "deb=$(ls xapiand_*.deb | head -1)" >> "$GITHUB_OUTPUT"

      - name: Attach DEB to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.pkg.outputs.deb }}
