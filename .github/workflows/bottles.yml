name: Bottles

# Build Homebrew bottles (pre-compiled binaries) for macOS across the
# arch x OS-version matrix, and attach them to the release. Trigger manually
# against an existing tag (workflow_dispatch) while iterating, or automatically
# on a version tag alongside the rest of the release.
#
# After the per-cell bottles are green, merge their JSONs into the formula's
# `bottle do` block (brew bottle --merge) and commit it to the tap; that final
# auto-merge/PR step is intentionally left as a follow-up.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bottle (e.g. v1.0.0-alpha.1)"
        required: true
        default: v1.0.0-alpha.1

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  bottle:
    name: Bottle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = x86_64 (Intel); macos-14/15 = arm64 (Apple Silicon).
        os: [macos-13, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Build bottle
        run: |
          set -eux
          TAP=kronuz/local
          brew tap-new "$TAP" --no-git
          cp contrib/homebrew/xapiand.rb "$(brew --repository "$TAP")/Formula/xapiand.rb"
          brew install --build-bottle "$TAP/xapiand"
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            "$TAP/xapiand"
          # Homebrew writes the file with a '--' separator, but the download URL in
          # the bottle DSL uses a single '-'; rename so the uploaded asset matches.
          for f in *--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          ls -la ./*.bottle.tar.gz ./*.bottle.json

      - name: Dump the full Homebrew build log on failure
        if: failure()
        run: |
          # Homebrew only echoes the "Last 15 lines" to the console, which is
          # almost always just warnings and hides the real compiler error. Print
          # the complete build logs so CI shows what actually failed.
          for f in ~/Library/Logs/Homebrew/xapiand/*.log; do
            echo "::group::$f"
            cat "$f" || true
            echo "::endgroup::"
          done

      - name: Attach bottle to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ./*.bottle.tar.gz

      - name: Upload bottle JSON (for the DSL merge)
        uses: actions/upload-artifact@v4
        with:
          name: bottle-json-${{ matrix.os }}
          path: ./*.bottle.json

  publish:
    name: Merge bottles into the tap
    needs: bottle
    runs-on: macos-15
    # Requires a HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with Contents:write on
    # Kronuz/homebrew-tap) -- the built-in GITHUB_TOKEN can't push to another repo.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - name: Collect the per-cell bottle JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: bottle-json-*
          merge-multiple: true
          path: json

      - name: Check out the tap (with write token)
        uses: actions/checkout@v4
        with:
          repository: Kronuz/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Merge the bottle DSL into the formula
        run: |
          set -eux
          # Expose the checked-out tap to brew so it can resolve the formula.
          TAP_DIR="$(brew --repository)/Library/Taps/kronuz/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          ln -sfn "$PWD/tap" "$TAP_DIR"
          # Fold every cell's sha256 into the formula's `bottle do` block.
          brew bottle --merge --write --no-commit json/*.bottle.json

      - name: Commit + push the updated formula
        run: |
          set -eux
          cd tap
          git config user.name "Germán Méndez Bravo"
          git config user.email "german.mb@gmail.com"
          if ! git diff --quiet; then
            git commit -am "xapiand: bottles for ${TAG}"
            git push
          fi

