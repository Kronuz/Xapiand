name: Bottles

# Build Homebrew bottles (pre-compiled binaries) for macOS and merge them into
# the tap so `brew install Kronuz/tap/xapiand` serves a pre-built binary.
#
# Structure:
#   - `bottle`       builds the arm64 cells (sonoma, sequoia). These are required
#                    and gate the tap merge.
#   - `bottle-intel` builds the x86_64 (Intel) cell on GitHub's deprecated,
#                    heavily-oversubscribed macos-13 runners. It is best-effort:
#                    it attaches its bottle to the release and uploads its JSON,
#                    but it never gates the arm64 bottles or the tap merge.
#   - `publish`      merges every bottle JSON that is available into the formula's
#                    `bottle do` block and pushes it to Kronuz/homebrew-tap. It
#                    depends only on `bottle`, so the tap updates in ~minutes; a
#                    slow Intel bottle is folded in whenever it happens to be ready.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bottle (e.g. v1.0.0-alpha.1)"
        required: true
        default: v1.0.0-alpha.1
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  bottle:
    name: Bottle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # arm64 (Apple Silicon): macos-14 = Sonoma, macos-15 = Sequoia. These are
        # required and gate the tap merge below.
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-bottle
        with:
          tag: ${{ env.TAG }}
          repository: ${{ github.repository }}
          os: ${{ matrix.os }}

  bottle-intel:
    name: Bottle (x86_64 via Rosetta on macos-14)
    runs-on: macos-14
    # GitHub's real x86_64 runners (macos-13) are deprecated and can queue for many
    # hours, so build the x86_64 bottle on an arm64 runner under Rosetta 2 instead: a
    # second, x86_64 Homebrew at /usr/local pulls x86_64 dependency bottles and builds
    # xapiand emulated (~30 min). The bottle targets Sonoma (macOS 14, the oldest arm64
    # runner GitHub offers), not Ventura -- x86_64 users on macOS 14+ get it, older
    # ones build from source. publish WAITS for this cell so the tap carries the x86_64
    # bottle; it stays continue-on-error so a Rosetta/emulation hiccup degrades the
    # release to arm64-only bottles (the cell shows as failed but the run stays green)
    # instead of blocking it, and timeout-minutes bounds how long publish can wait on a
    # wedged build.
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rosetta 2 and an x86_64 Homebrew
        shell: bash
        run: |
          set -eux
          softwareupdate --install-rosetta --agree-to-license
          if [ ! -x /usr/local/bin/brew ]; then
            curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o /tmp/brew-x86.sh
            NONINTERACTIVE=1 arch -x86_64 /bin/bash /tmp/brew-x86.sh
          fi
          arch -x86_64 /usr/local/bin/brew --version
      - uses: ./.github/actions/build-bottle
        with:
          tag: ${{ env.TAG }}
          repository: ${{ github.repository }}
          os: macos-14-x86_64
          brew: arch -x86_64 /usr/local/bin/brew

  publish:
    name: Merge bottles into the tap
    # Wait for the arm64 cells AND the Rosetta x86_64 cell, then fold whatever bottle
    # JSONs exist into the formula. Now that the Intel bottle builds under Rosetta in
    # ~half an hour (not the old macos-13 24h queue) it is worth waiting for, so a
    # release's tap update carries the x86_64 bottle too. bottle-intel is
    # continue-on-error and this job's `!cancelled()` gate lets publishing proceed
    # with just the arm64 bottles if the Intel cell ever fails or is skipped.
    needs: [bottle, bottle-intel]
    runs-on: macos-15
    # Requires a HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with Contents:write on
    # Kronuz/homebrew-tap) -- the built-in GITHUB_TOKEN can't push to another repo.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the per-cell bottle JSONs
        uses: actions/download-artifact@v4
        with:
          pattern: bottle-json-*
          merge-multiple: true
          path: json

      - name: Merge the bottle DSL into the tap formula and push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # brew bottle refuses to load a formula from a non-official ("untrusted")
          # tap. We own kronuz/tap, so opt out of the trust requirement for this step.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -eux
          # Tap the formula repo (a real git clone) so brew can resolve
          # kronuz/tap/xapiand.
          brew tap kronuz/tap https://github.com/Kronuz/homebrew-tap
          FORMULA="$(brew --repository kronuz/tap)/Formula/xapiand.rb"
          # Sync the tap's formula from contrib (the source of truth) and inject the
          # released tag as a stable url + fresh source sha256 -- the SAME transform
          # the build used -- so the tap formula's version matches the bottles we
          # built. Without this the tap keeps whatever it had committed and brew
          # derives the wrong bottle filename (which is how alpha.2 once shipped
          # bottles the tap thought were alpha.1). The committed formula is
          # head-only, so this injects rather than rewrites; awk is idempotent and
          # never touches labeled bottle-block sha256 lines.
          cp contrib/homebrew/xapiand.rb "$FORMULA"
          SRC_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA="$(curl -fsSL "$SRC_URL" | shasum -a 256 | cut -d' ' -f1)"
          awk -v u="$SRC_URL" -v s="$SRC_SHA" '/^  url /{next} /^  sha256 "/{next} {print} /^  homepage /{print "  url \"" u "\""; print "  sha256 \"" s "\""}' "$FORMULA" > "$FORMULA.tmp" && mv "$FORMULA.tmp" "$FORMULA"
          # Merge the per-cell bottle DSL into that formula.
          brew bottle --merge --write --no-commit json/*.bottle.json
          # Commit + push from the tapped clone, authenticating with the PAT.
          TAP_DIR="$(brew --repository kronuz/tap)"
          cd "$TAP_DIR"
          git config user.name "Germán Méndez Bravo"
          git config user.email "german.mb@gmail.com"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Kronuz/homebrew-tap.git"
          if ! git diff --quiet; then
            git commit -am "xapiand: bottles for ${TAG}"
            git push origin HEAD:master
          fi
