name: Deploy Docs to Pages

# Build the Astro/Starlight docs site (docs/) and deploy it to GitHub Pages. This
# replaces GitHub's automatic Jekyll build (the old docs/ was Jekyll; it now holds the
# Astro project). NOTE: this requires the repo's Pages "Source" to be set to
# "GitHub Actions" (Settings -> Pages) instead of "Deploy from a branch".
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      # The header version badge is read from PACKAGE_VERSION in the root CMakeLists.txt
      # at build time, so a release (the `chore: cut vX` bump) must redeploy the docs or
      # the badge goes stale. A bump-only commit touches nothing under docs/, hence this
      # path. (A `tags: [v*]` trigger wouldn't help: push tags AND paths are AND-ed, so a
      # bump-only tag push is filtered out by the docs/** path anyway.)
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs
      - name: Install D2 (build-time diagram renderer)
        # The architecture docs render ```d2 fences to SVG at build time by shelling
        # out to the d2 CLI (see docs/src/lib/renderD2.mjs). Without it, those pages build
        # empty. The public runner has internet egress, so install it before building.
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          d2 --version
      - name: Build site
        run: npm run build
        working-directory: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
