name: Deploy Docs to Pages

# Build the Astro/Starlight docs site (docs/) and deploy it to GitHub Pages. This
# replaces GitHub's automatic Jekyll build (the old docs/ was Jekyll; it now holds the
# Astro project). NOTE: this requires the repo's Pages "Source" to be set to
# "GitHub Actions" (Settings -> Pages) instead of "Deploy from a branch".
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      # The header version badge is read from PACKAGE_VERSION in the root CMakeLists.txt
      # at build time, so a release (the `chore: cut vX` bump) must redeploy the docs or
      # the badge goes stale. A bump-only commit touches nothing under docs/, hence this
      # path. (A `tags: [v*]` trigger wouldn't help: push tags AND paths are AND-ed, so a
      # bump-only tag push is filtered out by the docs/** path anyway.)
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: docs
      - name: Install D2 (build-time diagram renderer)
        # The architecture docs render ```d2 fences to SVG at build time by shelling
        # out to the d2 CLI through starlight-core. Without it, those pages build
        # empty. A pinned release with its checksum: no install script, no GitHub API calls.
        env:
          D2_VERSION: v0.9.0
          D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
        run: |
          tarball="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$tarball" "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/${tarball}"
          echo "${D2_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          sudo install -m 0755 "d2-${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 --version
      - name: Build site
        run: npm run build
        working-directory: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
