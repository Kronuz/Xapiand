name: FreeBSD

# Build Xapiand inside a real FreeBSD VM (vmactions runs it on the Linux runner)
# and attach a FreeBSD package to the release. Unlike Homebrew, the VM has network,
# so the FetchContent deps resolve exactly like the Linux/Docker builds.
#
# A dispatch with publish=false (and ref=<commit or branch>) builds the package at
# ref and attaches nothing to any release; the .pkg stays as a run artifact.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0-alpha.1)"
        required: true
        default: v1.0.0-alpha.1
      publish:
        description: "Attach the package to the release (false builds only)"
        type: boolean
        default: true
      ref:
        description: "Commit or branch to build when publish is false (default: the tag)"
        required: false
        default: ""
  push:
    branches: [master, 'quest/**', 'quick/**', 'codex/**']
    tags:
      - 'v[0-9]+.*'
    paths-ignore: ['.campaign/**']

concurrency:  # a newer push to the same branch replaces a queued or running build
  group: freebsd-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Tag pushes publish; a dispatch publishes unless publish is false.
  PUBLISH: ${{ github.event.inputs.publish != 'false' }}
  # What to build: the tag, or `ref` when not publishing (a release is always
  # built from its tag).
  REF: ${{ (github.event.inputs.publish == 'false' && github.event.inputs.ref) || github.event.inputs.tag || github.ref_name }}

jobs:
  freebsd-test:
    name: FreeBSD 14 Release + tests + 7c rows
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y cmake ninja git pkgconf zstd asio bash python3 curl node24 npm-node24
          run: |
            set -eux
            # The pinned newman (harness/package.json), installed as root before the suite runs as nobody.
            bash harness/newman_env.sh
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DLTO=OFF \
              -DASIO_INCLUDE_DIR=/usr/local/include
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure --parallel 4 --timeout 1800
            install -d -o nobody -g nobody "$PWD/.scratch/freebsd-e2e"
            su -m nobody -c 'TMPDIR="$PWD/.scratch/freebsd-e2e" RUN_ALL_STRICT=1 BIN="$PWD/build/bin/xapiand" bash harness/run_all.sh e2e'
            # Phase 7c's functional rows on this Release and an ASan+UBSan build (gate7c_rows.sh); each
            # row's result and log land in .scratch/rows-freebsd. The rows run as nobody (root startup demotes).
            cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLTO=OFF \
              -DASAN=ON -DUBSAN=ON -DFETCHCONTENT_BASE_DIR="$PWD/.deps" \
              -DASIO_INCLUDE_DIR=/usr/local/include
            cmake --build build-asan --parallel 2
            cmake --build build --target strata_check
            cmake --build build-asan --target strata_check
            install -d -o nobody -g nobody "$PWD/.scratch/rows-freebsd"
            chown -R nobody:nobody "$PWD/.deps" "$PWD/.scratch" || true
            rc=0
            su -m nobody -c 'TMPDIR="$PWD/.scratch/rows-freebsd" E2E_TIMEOUT_REQUEST=180000 ASAN_OPTIONS=detect_leaks=0 bash harness/gate7c_rows.sh "$PWD/build/bin/xapiand" "$PWD/build-asan/bin/xapiand" "$PWD/.scratch/rows-freebsd"' || rc=$?
            # The VM's files do not always come back after a failure: print each failed row's log here.
            while read -r row gating rrc secs; do
              [ "$rrc" = 0 ] || [ "$row" = row ] || { echo "=== $row (rc $rrc)"; tail -40 ".scratch/rows-freebsd/$row.log"; head -80 ".scratch/rows-freebsd/e2e-asan/assert.txt" 2>/dev/null | grep -q . && [ "$row" = t2_e2e_asan ] && head -120 .scratch/rows-freebsd/e2e-asan/assert.txt; tail -60 .scratch/rows-freebsd/e2e-asan/xe2e_node.log 2>/dev/null; }
            done < .scratch/rows-freebsd/rows.tsv
            exit $rc
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-test-logs
          path: |
            build/Testing/Temporary/LastTest*.log
            .scratch/rows-freebsd/*.tsv
            .scratch/rows-freebsd/*.log
            .scratch/rows-freebsd/e2e-asan/*.txt
            .scratch/rows-freebsd/e2e-asan/*.log
          if-no-files-found: ignore

  freebsd-pkg:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    name: FreeBSD .pkg (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Build + package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          envs: 'TAG'
          prepare: |
            pkg install -y cmake ninja git pkgconf zstd asio
          run: |
            set -eux
            cmake -G Ninja -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DASIO_INCLUDE_DIR=/usr/local/include
            ninja -C build
            DESTDIR="$PWD/stage" ninja -C build install
            # FreeBSD versions can't carry '-'; map 1.0.0-alpha.1 -> 1.0.0.alpha.1.
            VER=$(echo "${TAG#v}" | tr '-' '.')
            # Native FreeBSD package via pkg create -- no Ruby, no fpm.
            {
              echo 'name: xapiand'
              echo "version: \"${VER}\""
              echo 'origin: databases/xapiand'
              echo 'comment: RESTful search engine'
              echo 'desc: Xapiand is a RESTful search engine.'
              echo 'maintainer: german.mb@gmail.com'
              echo 'www: https://github.com/Kronuz/Xapiand'
              echo 'prefix: /usr/local'
              echo 'abi: "FreeBSD:14:amd64"'
              echo 'licenselogic: single'
              echo 'licenses: [MIT]'
            } > +MANIFEST
            ( cd stage && find usr/local \( -type f -o -type l \) | sed 's|^|/|' ) > plist
            pkg create -M +MANIFEST -r "$PWD/stage" -p "$PWD/plist" -o "$PWD"
            ls -la ./*.pkg

      - name: Keep the package as a run artifact (not published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-pkg
          path: ./*.pkg
          retention-days: 1

      - name: Attach FreeBSD package to the release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ./*.pkg
