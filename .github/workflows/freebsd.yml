name: FreeBSD

# Build Xapiand inside a real FreeBSD VM (vmactions runs it on the Linux runner)
# and attach a FreeBSD package to the release. Unlike Homebrew, the VM has network,
# so the FetchContent deps resolve exactly like the Linux/Docker builds.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0-alpha.1)"
        required: true
        default: v1.0.0-alpha.1
  push:
    branches: [master, 'quest/**', 'quick/**', 'codex/**']
    tags:
      - 'v[0-9]+.*'
    paths-ignore: ['.campaign/**']

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  freebsd-test:
    name: FreeBSD 14 Release + tests
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: |
            pkg install -y cmake ninja git pkgconf zstd asio bash python3 curl node24 npm-node24
            npm install -g newman@6
          run: |
            set -eux
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DLTO=OFF \
              -DASIO_INCLUDE_DIR=/usr/local/include
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure --parallel 4 --timeout 1800
            install -d -o nobody -g nobody "$PWD/.scratch/freebsd-e2e"
            su -m nobody -c 'TMPDIR="$PWD/.scratch/freebsd-e2e" RUN_ALL_STRICT=1 BIN="$PWD/build/bin/xapiand" bash harness/run_all.sh e2e'
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-test-logs
          path: build/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore

  freebsd-pkg:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    name: FreeBSD .pkg (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          envs: 'TAG'
          prepare: |
            pkg install -y cmake ninja git pkgconf zstd asio
          run: |
            set -eux
            cmake -G Ninja -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DASIO_INCLUDE_DIR=/usr/local/include
            ninja -C build
            DESTDIR="$PWD/stage" ninja -C build install
            # FreeBSD versions can't carry '-'; map 1.0.0-alpha.1 -> 1.0.0.alpha.1.
            VER=$(echo "${TAG#v}" | tr '-' '.')
            # Native FreeBSD package via pkg create -- no Ruby, no fpm.
            {
              echo 'name: xapiand'
              echo "version: \"${VER}\""
              echo 'origin: databases/xapiand'
              echo 'comment: RESTful search engine'
              echo 'desc: Xapiand is a RESTful search engine.'
              echo 'maintainer: german.mb@gmail.com'
              echo 'www: https://github.com/Kronuz/Xapiand'
              echo 'prefix: /usr/local'
              echo 'abi: "FreeBSD:14:amd64"'
              echo 'licenselogic: single'
              echo 'licenses: [MIT]'
            } > +MANIFEST
            ( cd stage && find usr/local \( -type f -o -type l \) | sed 's|^|/|' ) > plist
            pkg create -M +MANIFEST -r "$PWD/stage" -p "$PWD/plist" -o "$PWD"
            ls -la ./*.pkg

      - name: Attach FreeBSD package to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ./*.pkg
